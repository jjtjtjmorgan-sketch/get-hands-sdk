name: Documentation problem
description: Report unclear, incorrect, inaccessible, or outdated public documentation.
title: "docs: "
labels: [documentation]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private source, tenant data, or vulnerability details. Report security concerns privately through SECURITY.md.
  - type: input
    id: page
    attributes:
      label: Page or section
      placeholder: README.md#preview-status
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or incorrect?
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Suggested correction or evidence
      description: Link public evidence when possible. Say if a claim should be Prototype, Developer Preview, Shipped, or Planned.
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, personal data, tenant content, and private implementation details.
          required: true
